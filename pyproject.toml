[project]
name = "juice-shop-e2e"
version = "0.1.0"
description = "Test Automation Project"
readme = "README.md"
authors = [
    { name = "dns", email = "salnikovden@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "allure-python-commons>=2.16.2",
    "faker>=40.39.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "pytest-rerunfailures>=16.7",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors/warnings
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # isort: import order
    "B",       # bugbear: likely bugs (mutable defaults etc.)
    "UP",      # pyupgrade: use modern syntax for our Python version
    "SIM",     # simplify: needlessly complex code
    "N",       # pep8-naming: snake_case / PascalCase
    "PT",      # flake8-pytest-style: pytest idioms
    "RUF",     # ruff-specific rules
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    # TS fullyParallel (xdist). 4 workers measured fastest locally for this suite (16 workers
    # were slower than serial: one browser per worker). CI overrides with `-n auto`.
    # Use `-n 0` to debug serially.
    "-n", "4",
    # TS trace: 'on-first-retry' has no pytest-playwright equivalent; this is a superset (R5).
    "--tracing", "retain-on-failure",
    "--screenshot", "only-on-failure",
    "--video", "retain-on-failure",
    # Raw Allure results; the HTML report is generated by Allure 3 (`npx allure@3.14.3`, see README).
    "--alluredir", "allure-results",
]
# TS timeout: 45_000 per test (pytest-timeout, seconds).
# TS retries: CI ? 2 : 0 -> CI passes `--reruns 2` (pytest-rerunfailures); none locally.
timeout = 45
markers = ["smoke: fast critical-path subset (run with -m smoke)"]
